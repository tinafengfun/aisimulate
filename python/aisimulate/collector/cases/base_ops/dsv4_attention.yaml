schema_version: 1
op: dsv4_attention
description: >-
  Universal sweep budgets for the DSV4 CSA/HCA attention module collectors
  (trtllm and vllm). These are op-level budget fields (case_authoring.md
  "the op's universal math (identities, budgets)" — generator constraint /
  base-op budget field), NOT model properties, so they live at the base-op
  layer; the model file declares only the model-correlated grids. Enforced
  at case-generation time with per-reason counted drops.
common_case_values:
  dsv4_module_budgets:
    max_seq_len: 65536
    max_context_query_tokens: 262144
    max_generation_kv_tokens: 1048576
    # decode batch ladder: [seq_len_floor, max_batch] — a decode shape with
    # sl >= seq_len_floor and bs > max_batch is out of budget.
    decode_batch_ladder:
    - [524288, 1]
    - [262144, 2]
    - [131072, 4]
    - [65536, 8]
    - [32768, 16]
    - [8192, 64]
  # vLLM-XPU (CRI) DSV4 attention-module grids. Axes per NV §4/§5/§10/§11;
  # models/window/kv constraints per §26/§27. gemm_types mxfp8 only (fp8_block
  # routes the wo_a bmm to oneDNN's reference); kv_cache_dtype fixed fp8 (XPU
  # fp8mix insert kernel has no bf16-row path); prefix [0] per NV specs.
  dsv4_xpu_attention:
    grids:
    # §10/§11 csa (hca deferred: OpEntries stay, grid resumes when hca testing does).
    - attn_kinds: [csa]
      model_paths:
      - deepseek-ai/DeepSeek-V4-Flash
      - deepseek-ai/DeepSeek-V4-Pro
      gemm_types: [mxfp8]
      tp_sizes: [1, 2, 4, 8]
      context_batch_sizes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
      context_sequence_lengths: [1, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 1536, 2048, 3072, 4096, 6144, 8192]
      context_prefix_lengths: [0]
      generation_batch_sizes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
      generation_steps: [1, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 1536, 2048, 3072, 4096, 6144, 8192, 10240,
        12288, 16384, 32768, 65536, 131072, 262144, 524288, 1048575]
      max_batch_tokens: 1048576
    # §4/§5 swa axes + §26 budget batch*isl <= 1048576; window 128, step 127
    # saturates it. Model = V4-Flash only (ruling 2026-10-11: §4 single-model
    # scope; supersedes the §27 two-model list — V4.1-Flash had no NV counterpart).
    - attn_kinds: [swa]
      model_paths:
      - deepseek-ai/DeepSeek-V4-Flash
      gemm_types: [mxfp8]
      tp_sizes: [1, 2, 4, 8]
      context_batch_sizes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
      context_sequence_lengths: [1, 16, 64, 128, 256, 1024, 2048, 4096]
      context_prefix_lengths: [0]
      generation_batch_sizes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
      generation_steps: [127]
      max_batch_tokens: 1048576
